<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visor de personajes</title>
    <style>
      :root { color-scheme: dark; --bg: #16161c; --panel: #202029; --text: #e6e6ee; --muted: #9a9aab; --accent: #6c8cff; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
      canvas { image-rendering: pixelated; background: #000; max-width: 100%; border-radius: 6px; }
      aside { background: var(--panel); border-radius: 8px; padding: 12px; width: 300px; display: flex; flex-direction: column; gap: 10px; }
      label { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
      select, button { background: #2b2b36; color: var(--text); border: 1px solid #3a3a48; border-radius: 4px; padding: 4px 8px; font: inherit; }
      button:hover { border-color: var(--accent); }
      .row { display: flex; gap: 6px; }
      pre { margin: 0; color: var(--muted); font-size: 12px; white-space: pre-wrap; }
      h1 { font-size: 15px; margin: 0; }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <aside>
      <h1 id="title">Cargando…</h1>
      <label>Personaje <select id="char"></select></label>
      <label>Acción <select id="action"></select></label>
      <label>Paleta <select id="palette"></select></label>
      <label>Zoom <select id="zoom"><option>1</option><option selected>2</option><option>3</option></select></label>
      <label>Mirar a la izquierda <input type="checkbox" id="flip" /></label>
      <label>Cajas de colisión <input type="checkbox" id="clsn" checked /></label>
      <div class="row">
        <button id="play">Pausa</button>
        <button id="step">Avanzar 1 tick</button>
        <button id="prev">◀</button>
        <button id="next">▶</button>
      </div>
      <pre id="info"></pre>
    </aside>
    <script type="module" src="./viewer/main.ts"></script>
  </body>
</html>
